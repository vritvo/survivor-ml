[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "survivor-ml"
version = "0.1.0"
description = "Episode-by-episode win and elimination models for US Survivor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",  # <1.8 ignores l1_ratio, silently fitting L2
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.9",
]

[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb"]  # not pyproject.toml; editors mis-lint it as Python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
